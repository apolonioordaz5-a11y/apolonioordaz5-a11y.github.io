<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" role="img" aria-labelledby="title desc">
  <title id="title">Normalized velocity in the cylinder wake</title>
  <desc id="desc">Profiles measured 17.5 and 25 inches downstream both show their deepest velocity deficit near the wake centerline and recover toward free-stream velocity away from the wake.</desc>
  <rect width="800" height="460" fill="#f8f3ea"/>
  <g stroke="#d9c6a9" stroke-width="1">
    <path d="M86 70H750M86 140H750M86 210H750M86 280H750M86 350H750"/>
    <path d="M86 70V350M252 70V350M418 70V350M584 70V350M750 70V350"/>
  </g>
  <g fill="#5f5148" font-family="Consolas, monospace" font-size="13">
    <text x="43" y="75">1.10</text><text x="43" y="145">1.00</text><text x="43" y="215">0.90</text><text x="43" y="285">0.80</text>
    <text x="76" y="376">-2.7</text><text x="244" y="376">-1.3</text><text x="412" y="376">0.0</text><text x="576" y="376">1.3</text><text x="740" y="376">2.7</text>
    <text x="315" y="420">NORMALIZED POSITION, y/D</text>
    <text transform="translate(22 276) rotate(-90)">NORMALIZED VELOCITY, u/U</text>
  </g>
  <polyline fill="none" stroke="#2f2a26" stroke-width="4" stroke-dasharray="10 7" stroke-linecap="round" points="86,79 128,82 169,87 211,102 252,125 294,157 335,189 377,242 418,226 460,172 501,129 543,111 584,104 626,91 667,80 709,78 750,79"/>
  <polyline fill="none" stroke="#b88f5d" stroke-width="4" stroke-linecap="round" points="86,82 128,87 169,98 211,112 252,132 294,166 335,206 377,250 418,220 460,184 501,156 543,135 584,112 626,98 667,84 709,78 750,72"/>
  <g font-family="Arial, sans-serif">
    <text x="86" y="35" fill="#2f2a26" font-size="20" font-weight="700">Wake velocity deficit</text>
    <line x1="490" y1="35" x2="530" y2="35" stroke="#2f2a26" stroke-width="4" stroke-dasharray="10 7"/><text x="540" y="40" fill="#5f5148" font-size="13">17.5 in downstream</text>
    <line x1="490" y1="58" x2="530" y2="58" stroke="#b88f5d" stroke-width="4"/><text x="540" y="63" fill="#5f5148" font-size="13">25.0 in downstream</text>
  </g>
</svg>
