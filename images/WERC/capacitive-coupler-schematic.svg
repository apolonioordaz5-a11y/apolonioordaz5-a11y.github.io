<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Four-plate capacitive rover charging coupler</title>
  <desc id="desc">A rover approaches a station. Two rounded charging plates on each side face across an air gap. The rover plate has a protective door; the station plate includes an electrodynamic dust-shield layer.</desc>
  <rect width="1200" height="720" fill="#f4f4f4"/>
  <g fill="none" stroke="#111" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <path d="M80 594H1120" stroke="#777" stroke-width="5"/>
    <path d="M120 526V318H422V526"/>
    <path d="M778 526V246H1080V526"/>
    <path d="M183 526v42M355 526v42M840 526v42M1018 526v42" stroke-width="22"/>
    <path d="M104 568h334M762 568h334"/>
  </g>
  <g fill="#fff" stroke="#111" stroke-width="10">
    <rect x="338" y="344" width="64" height="92" rx="12"/>
    <rect x="338" y="458" width="64" height="92" rx="12"/>
    <rect x="798" y="344" width="64" height="92" rx="12"/>
    <rect x="798" y="458" width="64" height="92" rx="12"/>
  </g>
  <g fill="none" stroke="#555" stroke-width="4" stroke-dasharray="10 10">
    <path d="M402 390H798M402 504H798"/>
  </g>
  <g font-family="Arial, sans-serif" fill="#111">
    <text x="270" y="238" text-anchor="middle" font-size="34" font-weight="700">ROVER</text>
    <text x="930" y="166" text-anchor="middle" font-size="34" font-weight="700">CHARGING STATION</text>
    <text x="600" y="330" text-anchor="middle" font-size="26">non-contact air gap</text>
    <text x="370" y="316" text-anchor="middle" font-size="24">protective door</text>
    <text x="830" y="316" text-anchor="middle" font-size="24">EDS cover layer</text>
    <text x="270" y="646" text-anchor="middle" font-size="25">vertical, high-mounted plate pair</text>
    <text x="930" y="646" text-anchor="middle" font-size="25">matching station plate pair</text>
  </g>
  <g fill="#ff8a3d">
    <circle cx="402" cy="390" r="8"/><circle cx="402" cy="504" r="8"/>
    <circle cx="798" cy="390" r="8"/><circle cx="798" cy="504" r="8"/>
  </g>
</svg>
