<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Four-plate capacitive rover charging coupler, side view</title>
  <desc id="desc">A rover with two small recessed charging plates faces a charging station across a 100 mm air gap (75 to 150 mm). The station's two larger plates sit on a spring flexure mount with an electrodynamic dust shield, and a dust flap covers them when idle.</desc>
  <rect width="1200" height="720" fill="#f4f4f4"/>

  <g font-family="Inter, Arial, sans-serif">
    <!-- Notes -->
    <text x="60" y="66" font-size="22" fill="#8a8a8a">Side view (not to scale)</text>
    <g font-size="22" fill="#222">
      <text x="60" y="118">Rover side: small, light,</text>
      <text x="60" y="146">recessed plates (2 pairs)</text>
      <text x="60" y="196">Station side: plates +50 mm per side</text>
      <text x="60" y="224">on a flexure mount (absorbs offset + tilt),</text>
      <text x="60" y="252">EDS dust shield</text>
    </g>

    <!-- Ground -->
    <path d="M40 630H1160" stroke="#333" stroke-width="3"/>

    <!-- Rover -->
    <rect x="120" y="390" width="300" height="190" rx="22" fill="#e8e8e8" stroke="#333" stroke-width="3"/>
    <text x="270" y="478" text-anchor="middle" font-size="30" font-weight="700" fill="#222">Rover</text>
    <text x="270" y="510" text-anchor="middle" font-size="20" fill="#8a8a8a">(FLIP class)</text>
    <circle cx="195" cy="585" r="45" fill="#fff" stroke="#333" stroke-width="3"/>
    <circle cx="345" cy="585" r="45" fill="#fff" stroke="#333" stroke-width="3"/>

    <!-- Rover plates -->
    <g fill="#14919b">
      <rect x="420" y="408" width="12" height="62" rx="3"/>
      <rect x="420" y="488" width="12" height="62" rx="3"/>
    </g>

    <!-- Coupling field across the gap -->
    <g stroke="#14919b" stroke-width="2" stroke-dasharray="6 6" opacity="0.8">
      <path d="M432 424L764 400M432 439L764 422M432 454L764 444"/>
      <path d="M432 504L764 506M432 519L764 528M432 534L764 550"/>
    </g>

    <!-- Station -->
    <rect x="930" y="250" width="110" height="380" fill="#e8e8e8" stroke="#333" stroke-width="3"/>
    <text x="985" y="234" text-anchor="middle" font-size="30" font-weight="700" fill="#222">Station</text>

    <!-- Flexure springs -->
    <g fill="none" stroke="#333" stroke-width="3" stroke-linejoin="round">
      <path d="M796 422H830l10-14 16 28 16-28 16 28 16-28 10 14H930"/>
      <path d="M796 528H830l10-14 16 28 16-28 16 28 16-28 10 14H930"/>
    </g>

    <!-- Backing panel and station plates -->
    <rect x="780" y="360" width="16" height="232" fill="#333"/>
    <g fill="#14919b">
      <rect x="764" y="376" width="14" height="96" rx="3"/>
      <rect x="764" y="482" width="14" height="96" rx="3"/>
    </g>

    <!-- Dust flap -->
    <path d="M786 352L738 272" stroke="#f5a623" stroke-width="8" stroke-linecap="round"/>
    <text x="738" y="256" text-anchor="middle" font-size="20" fill="#222">dust flap</text>

    <!-- Gap dimension -->
    <g stroke="#222" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M450 604H748"/>
      <path d="M462 596L450 604L462 612M736 596L748 604L736 612"/>
    </g>
    <text x="599" y="588" text-anchor="middle" font-size="22" fill="#222">gap 100 mm (75 to 150)</text>

    <!-- Berm -->
    <path d="M1048 630L1088 572H1160V630" fill="#ededed" stroke="#aaa" stroke-width="2"/>
    <text x="1120" y="610" text-anchor="middle" font-size="18" fill="#999">berm</text>

    <!-- Legend -->
    <rect x="60" y="670" width="18" height="18" fill="#14919b"/>
    <text x="90" y="686" font-size="20" fill="#222">plates: Al + Kapton FN / FEP skin</text>
    <rect x="520" y="670" width="18" height="18" fill="#f5a623"/>
    <text x="550" y="686" font-size="20" fill="#222">flap: dust cover, shade, safe standby</text>
  </g>
</svg>
