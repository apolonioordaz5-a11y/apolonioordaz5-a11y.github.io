<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Four-plate capacitive rover charging coupler, side view</title>
  <desc id="desc">Engineering side view. A rover with two small recessed charging plates faces a charging station across a 100 mm gap (75 to 150 mm). The station's two larger plates sit on a spring flexure mount with an electrodynamic dust shield, and a hinged dust flap covers them when idle.</desc>
  <defs>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#1a1a1a" stroke-width="1.2"/>
    </pattern>
    <pattern id="earth" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="14" stroke="#1a1a1a" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 1.5L10 5L0 8.5z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <rect width="1200" height="720" fill="#fff"/>
  <rect x="20" y="20" width="1160" height="680" fill="none" stroke="#1a1a1a" stroke-width="2"/>

  <g font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a" stroke-linecap="round" stroke-linejoin="round">

    <!-- Parts list -->
    <g font-size="15" letter-spacing="0.04em">
      <rect x="40" y="40" width="520" height="170" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
      <path d="M40 64H560M90 40V210M310 40V210" stroke="#1a1a1a" stroke-width="1.2"/>
      <path d="M40 88H560M40 112H560M40 136H560M40 160H560M40 184H560" stroke="#1a1a1a" stroke-width="0.6"/>
      <g font-weight="700"><text x="65" y="57" text-anchor="middle">NO.</text><text x="102" y="57">ITEM</text><text x="322" y="57">NOTE</text></g>
      <text x="65" y="81" text-anchor="middle">1</text><text x="102" y="81">ROVER PLATES (2 PAIR)</text><text x="322" y="81">SMALL, LIGHT, RECESSED</text>
      <text x="65" y="105" text-anchor="middle">2</text><text x="102" y="105">STATION PLATES</text><text x="322" y="105">+50 mm PER SIDE</text>
      <text x="65" y="129" text-anchor="middle">3</text><text x="102" y="129">FLEXURE MOUNT</text><text x="322" y="129">ABSORBS OFFSET + TILT</text>
      <text x="65" y="153" text-anchor="middle">4</text><text x="102" y="153">DUST FLAP</text><text x="322" y="153">COVER, SHADE, STANDBY</text>
      <text x="65" y="177" text-anchor="middle">5</text><text x="102" y="177">EDS DUST SHIELD</text><text x="322" y="177">ON STATION PLATE FACE</text>
      <text x="65" y="201" text-anchor="middle">6</text><text x="102" y="201">BERM</text><text x="322" y="201">&#8212;</text>
      <text x="40" y="234" font-size="14">PLATES: Al + KAPTON FN / FEP SKIN</text>
    </g>

    <!-- Ground -->
    <rect x="60" y="560" width="1080" height="16" fill="url(#earth)"/>
    <path d="M60 560H1140" stroke="#1a1a1a" stroke-width="2.5"/>

    <!-- Rover -->
    <g fill="#fff" stroke="#1a1a1a" stroke-width="2.5">
      <path d="M150 370V332M140 332h24v-18h-24z"/>
      <path d="M110 370H400V386H390V510H400V520H110Z"/>
      <circle cx="170" cy="520" r="40"/><circle cx="340" cy="520" r="40"/>
      <circle cx="170" cy="520" r="8"/><circle cx="340" cy="520" r="8"/>
    </g>
    <text x="250" y="452" text-anchor="middle" font-size="17" font-weight="700" letter-spacing="0.08em">ROVER</text>
    <text x="250" y="474" text-anchor="middle" font-size="14" letter-spacing="0.06em">(FLIP CLASS)</text>

    <!-- 1: Rover plates, recessed in the front face -->
    <g fill="url(#hatch)" stroke="#1a1a1a" stroke-width="2">
      <rect x="396" y="394" width="12" height="52"/>
      <rect x="396" y="454" width="12" height="52"/>
    </g>

    <!-- Station -->
    <rect x="900" y="200" width="110" height="360" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/>
    <text x="955" y="380" text-anchor="middle" font-size="17" font-weight="700" letter-spacing="0.08em" transform="rotate(-90 955 380)">STATION</text>

    <!-- 3: Flexure springs -->
    <g fill="none" stroke="#1a1a1a" stroke-width="2">
      <path d="M782 412H812l8-12 14 24 14-24 14 24 14-24 14 24 8-12H900"/>
      <path d="M782 502H812l8-12 14 24 14-24 14 24 14-24 14 24 8-12H900"/>
    </g>

    <!-- Backing plate and 2: station plates -->
    <rect x="770" y="362" width="12" height="190" fill="#1a1a1a"/>
    <g fill="url(#hatch)" stroke="#1a1a1a" stroke-width="2">
      <rect x="756" y="374" width="14" height="78"/>
      <rect x="756" y="462" width="14" height="78"/>
    </g>
    <!-- 5: EDS shield layer -->
    <path d="M751 372V542" stroke="#1a1a1a" stroke-width="1.2" stroke-dasharray="4 3"/>

    <!-- 4: Dust flap, open (solid) and closed (phantom) -->
    <circle cx="776" cy="356" r="4" fill="#fff" stroke="#1a1a1a" stroke-width="2"/>
    <path d="M773 353L726 290" stroke="#1a1a1a" stroke-width="4"/>
    <path d="M776 356L744 360V548" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-dasharray="16 4 3 4"/>

    <!-- 6: Berm -->
    <path d="M1030 560L1066 500H1140" fill="none" stroke="#1a1a1a" stroke-width="2"/>

    <!-- Gap dimension -->
    <g stroke="#1a1a1a" stroke-width="1.2" fill="none">
      <path d="M408 390V318M756 370V318"/>
      <path d="M412 326H752" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    </g>
    <text x="582" y="316" text-anchor="middle" font-size="16" letter-spacing="0.04em">100 (75–150)</text>

    <!-- Callouts -->
    <g stroke="#1a1a1a" stroke-width="1.2" fill="none">
      <path d="M320 286L400 406"/>
      <path d="M652 404L758 420"/>
      <path d="M856 300L848 400"/>
      <path d="M676 262L734 302"/>
      <path d="M652 494L750 500"/>
      <path d="M1104 452L1090 500"/>
    </g>
    <g fill="#fff" stroke="#1a1a1a" stroke-width="1.5">
      <circle cx="312" cy="274" r="14"/><circle cx="638" cy="402" r="14"/>
      <circle cx="858" cy="286" r="14"/><circle cx="664" cy="254" r="14"/>
      <circle cx="638" cy="494" r="14"/><circle cx="1106" cy="438" r="14"/>
    </g>
    <g font-size="15" font-weight="700" text-anchor="middle">
      <text x="312" y="279">1</text><text x="638" y="407">2</text>
      <text x="858" y="291">3</text><text x="664" y="259">4</text>
      <text x="638" y="499">5</text><text x="1106" y="443">6</text>
    </g>

    <!-- Title block -->
    <g font-size="14" letter-spacing="0.05em">
      <rect x="800" y="600" width="380" height="100" fill="#fff" stroke="#1a1a1a" stroke-width="2"/>
      <path d="M800 640H1180M990 640V700" stroke="#1a1a1a" stroke-width="1.2"/>
      <text x="814" y="626" font-size="16" font-weight="700">CAPACITIVE ROVER COUPLER</text>
      <text x="814" y="664">VIEW: SIDE</text>
      <text x="814" y="688">SCALE: NTS</text>
      <text x="1004" y="664">UNITS: mm</text>
      <text x="1004" y="688">WERC 2027 · TASK 4</text>
    </g>
  </g>
</svg>
